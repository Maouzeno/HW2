
services:
  db:
    image: postgres
    container_name: db_1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: myshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myshop"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      db:
        condition: service_healthy
    build: ./test/api-server
    image: api_image
    container_name: api_1
    command: bash -c "npm start"
    ports:
      - "8080:8080"
    volumes:
      - ./test/api-server:/data/app
